  <path d="M8.5 14C7.67157 14 7 13.1046 7 12C7 10.8954 7.67157 10 8.5 10C9.32843 10 10 10.8954 10 12C10 13.1046 9.32843 14 8.5 14Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="ai-secondary ai-anim-scale-pop ai-delay-3" />
  <path d="M15.5 14C14.6716 14 14 13.1046 14 12C14 10.8954 14.6716 10 15.5 10C16.3284 10 17 10.8954 17 12C17 13.1046 16.3284 14 15.5 14Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="ai-secondary ai-anim-scale-pop ai-delay-4" />
