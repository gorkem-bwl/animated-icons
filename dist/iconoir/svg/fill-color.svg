  <path d="M8.29297 1.80762L9.70718 3.22183" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="ai-secondary ai-anim-fade ai-delay-1" />
  <path fill-rule="evenodd" clip-rule="evenodd" d="M19.9991 15C19.9991 15 22.9991 17.9934 22.9994 19.8865C22.9997 21.5422 21.6552 22.8865 19.9997 22.8865C18.3442 22.8865 17.012 21.5422 17 19.8865C17.0098 17.9924 19.9991 15 19.9991 15Z" stroke="currentColor" stroke-width="1.49993" stroke-miterlimit="1.5" stroke-linecap="round" stroke-linejoin="round" class="ai-secondary ai-anim-fade ai-delay-2" />
</svg>