  <path d="M9 5L8.20966 5.13172C7.03189 5.32802 6.28739 6.50588 6.61542 7.65395L8 12.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="ai-secondary ai-anim-scale-pop ai-delay-1" />
  <path d="M11 12.5L8.92263 4.60598C8.69579 3.744 9.25886 2.87352 10.1381 2.72699V2.72699C10.9097 2.59838 11.6523 3.07873 11.8514 3.83526L14 12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="ai-secondary ai-anim-scale-pop ai-delay-2" />
  <path d="M17 12.5L18 7.5L18.2475 6.01515C18.3869 5.17836 17.8216 4.38694 16.9848 4.24747V4.24747C16.16 4.11 15.3767 4.65763 15.2226 5.47955L14 12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="ai-secondary ai-anim-scale-pop ai-delay-3" />
</svg>