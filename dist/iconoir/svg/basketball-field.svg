  <path d="M12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9C13.6569 9 15 10.3431 15 12C15 13.6569 13.6569 15 12 15Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="ai-secondary ai-anim-fade ai-delay-1" />
  <path d="M2 17C4.76142 17 7 14.7614 7 12C7 9.23858 4.76142 7 2 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="ai-secondary ai-anim-fade ai-delay-2" />
  <path d="M22 17C19.2386 17 17 14.7614 17 12C17 9.23858 19.2386 7 22 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="ai-secondary ai-anim-fade ai-delay-3" />
</svg>