<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-settings"
  role="img"
  aria-label="settings"
>
  <title>settings</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes gear-spin-0 {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(90deg); }
}
@keyframes gear-spin-1 {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(-90deg); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: gear-spin-0 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: gear-spin-1 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

</style>
  <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" class="animated-lucide-primary animated-lucide-el-0" style="transform-origin: 12px 12px;" />
  <circle cx="12" cy="12" r="3" class="animated-lucide-secondary animated-lucide-el-1" style="transform-origin: 12px 12px;" />
</svg>