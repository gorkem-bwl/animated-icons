<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-chevron-down"
  role="img"
  aria-label="chevron down"
>
  <title>chevron down</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes chevron-bounce {
  0% { transform: translateY(0); }
  30% { transform: translateY(5px); }
  50% { transform: translateY(-3px); }
  70% { transform: translateY(2px); }
  100% { transform: translateY(0); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: chevron-bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

</style>
  <path d="m6 9 6 6 6-6" class="animated-lucide-primary animated-lucide-el-0" style="" />
</svg>