<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-volume-2"
  role="img"
  aria-label="volume 2"
>
  <title>volume 2</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes sound-pulse-0 {
  0% { transform: translateX(0); }
  30% { transform: translateX(-2px); }
  60% { transform: translateX(1px); }
  100% { transform: translateX(0); }
}
@keyframes sound-pulse-1 {
  0% { transform: scaleX(1) translateX(0); opacity: 0.4; }
  30% { transform: scaleX(1.4) translateX(3px); opacity: 1; }
  60% { transform: scaleX(0.8) translateX(-1px); opacity: 0.6; }
  100% { transform: scaleX(1) translateX(0); opacity: 0.55; }
}
@keyframes sound-pulse-2 {
  0% { transform: scaleX(1) translateX(0); opacity: 0.4; }
  30% { transform: scaleX(1.4) translateX(3px); opacity: 1; }
  60% { transform: scaleX(0.8) translateX(-1px); opacity: 0.6; }
  100% { transform: scaleX(1) translateX(0); opacity: 0.55; }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: sound-pulse-0 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0s both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: sound-pulse-1 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; }
.animated-lucide-icon:hover .animated-lucide-el-2,
.al-icon-wrapper:hover .animated-lucide-el-2 { animation: sound-pulse-2 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both; }

</style>
