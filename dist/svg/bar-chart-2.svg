<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-bar-chart-2"
  role="img"
  aria-label="bar chart 2"
>
  <title>bar chart 2</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes bar-rise-bar-chart-2-0 {
  0% { transform: scaleY(0.3); opacity: 0.5; }
  60% { transform: scaleY(1.05); opacity: 1; }
  100% { transform: scaleY(1); opacity: 1; }
}
@keyframes bar-rise-bar-chart-2-1 {
  0% { transform: scaleY(0.3); opacity: 0.5; }
  60% { transform: scaleY(1.05); opacity: 1; }
  100% { transform: scaleY(1); opacity: 1; }
}
@keyframes bar-rise-bar-chart-2-2 {
  0% { transform: scaleY(0.3); opacity: 0.5; }
  60% { transform: scaleY(1.05); opacity: 1; }
  100% { transform: scaleY(1); opacity: 1; }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: bar-rise-bar-chart-2-0 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0s both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: bar-rise-bar-chart-2-1 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.08s both; }
.animated-lucide-icon:hover .animated-lucide-el-2,
.al-icon-wrapper:hover .animated-lucide-el-2 { animation: bar-rise-bar-chart-2-2 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.16s both; }

</style>
  <path d="M5 21v-6" class="animated-lucide-primary animated-lucide-el-0" style="transform-origin: center bottom;" />
  <path d="M12 21V3" class="animated-lucide-secondary animated-lucide-el-1" style="transform-origin: center bottom;" />
  <path d="M19 21V9" class="animated-lucide-primary animated-lucide-el-2" style="transform-origin: center bottom;" />
</svg>