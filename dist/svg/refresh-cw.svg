<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-refresh-cw"
  role="img"
  aria-label="refresh cw"
>
  <title>refresh cw</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes spin-refresh-cw-0 {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(180deg); }
  100% { transform: rotate(360deg); }
}
@keyframes spin-refresh-cw-1 {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(180deg); }
  100% { transform: rotate(360deg); }
}
@keyframes spin-refresh-cw-2 {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(180deg); }
  100% { transform: rotate(360deg); }
}
@keyframes spin-refresh-cw-3 {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(180deg); }
  100% { transform: rotate(360deg); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: spin-refresh-cw-0 0.65s cubic-bezier(0.4, 0, 0.2, 1); }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: spin-refresh-cw-1 0.65s cubic-bezier(0.4, 0, 0.2, 1); }
.animated-lucide-icon:hover .animated-lucide-el-2,
.al-icon-wrapper:hover .animated-lucide-el-2 { animation: spin-refresh-cw-2 0.65s cubic-bezier(0.4, 0, 0.2, 1); }
.animated-lucide-icon:hover .animated-lucide-el-3,
.al-icon-wrapper:hover .animated-lucide-el-3 { animation: spin-refresh-cw-3 0.65s cubic-bezier(0.4, 0, 0.2, 1); }

</style>
  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" class="animated-lucide-primary animated-lucide-el-0" style="transform-origin: 12px 12px;" />
  <path d="M21 3v5h-5" class="animated-lucide-secondary animated-lucide-el-1" style="transform-origin: 12px 12px;" />
  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" class="animated-lucide-secondary animated-lucide-el-2" style="transform-origin: 12px 12px;" />
  <path d="M8 16H3v5" class="animated-lucide-secondary animated-lucide-el-3" style="transform-origin: 12px 12px;" />
</svg>