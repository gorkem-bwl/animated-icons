<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-play"
  role="img"
  aria-label="play"
>
  <title>play</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes play-press-0 {
  0% { transform: scale(1) translateX(0); }
  25% { transform: scale(0.75) translateX(-2px); }
  50% { transform: scale(1.2) translateX(3px); }
  75% { transform: scale(0.95) translateX(0); }
  100% { transform: scale(1) translateX(0); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: play-press-0 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0s both; }

</style>
  <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" class="animated-lucide-primary animated-lucide-el-0" style="transform-origin: 10px 12px;" />
</svg>