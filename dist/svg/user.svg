<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-user"
  role="img"
  aria-label="user"
>
  <title>user</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes wave-user-0 {
  0% { transform: rotate(0deg) translateY(0); }
  25% { transform: rotate(-3deg) translateY(-1px); }
  50% { transform: rotate(3deg) translateY(0); }
  75% { transform: rotate(-1deg) translateY(-0.5px); }
  100% { transform: rotate(0deg) translateY(0); }
}
@keyframes wave-user-1 {
  0% { transform: rotate(0deg) translateY(0); }
  25% { transform: rotate(-3deg) translateY(-1px); }
  50% { transform: rotate(3deg) translateY(0); }
  75% { transform: rotate(-1deg) translateY(-0.5px); }
  100% { transform: rotate(0deg) translateY(0); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: wave-user-0 0.5s ease 0s both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: wave-user-1 0.5s ease 0.08s both; }

</style>
  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" class="animated-lucide-primary animated-lucide-el-0" style="transform-origin: 12px 16px;" />
  <circle cx="12" cy="7" r="4" class="animated-lucide-secondary animated-lucide-el-1" style="transform-origin: 12px 16px;" />
</svg>