<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-x"
  role="img"
  aria-label="x"
>
  <title>x</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes toggle-pop-x-0 {
  0% { transform: scale(1); }
  50% { transform: scale(0.8); }
  100% { transform: scale(1); }
}
@keyframes toggle-pop-x-1 {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: toggle-pop-x-0 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: toggle-pop-x-1 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

</style>
  <path d="M18 6 6 18" class="animated-lucide-primary animated-lucide-el-0" style="transform-origin: 12px 12px;" />
  <path d="m6 6 12 12" class="animated-lucide-secondary animated-lucide-el-1" style="transform-origin: 12px 12px;" />
</svg>