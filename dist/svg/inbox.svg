<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-inbox"
  role="img"
  aria-label="inbox"
>
  <title>inbox</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes inbox-drop-0 {
  0% { transform: translateY(-10px); opacity: 0; }
  50% { transform: translateY(3px); opacity: 1; }
  70% { transform: translateY(-2px); }
  100% { transform: translateY(0); opacity: 1; }
}
@keyframes inbox-drop-1 {
  0% { transform: scaleY(1) translateY(0); }
  50% { transform: scaleY(0.92) translateY(2px); }
  100% { transform: scaleY(1) translateY(0); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: inbox-drop-0 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0s both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: inbox-drop-1 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s both; }

</style>
  <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" class="animated-lucide-secondary animated-lucide-el-0" style="" />
  <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" class="animated-lucide-primary animated-lucide-el-1" style="transform-origin: center bottom;" />
</svg>