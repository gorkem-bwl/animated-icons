<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-rocket"
  role="img"
  aria-label="rocket"
>
  <title>rocket</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes rocket-launch-0 {
  0% { transform: translate(0, 0); }
  50% { transform: translate(2px, -3px); }
  100% { transform: translate(0, 0); }
}
@keyframes rocket-launch-1 {
  0% { transform: translate(0, 0); }
  50% { transform: translate(2px, -3px); }
  100% { transform: translate(0, 0); }
}
@keyframes rocket-launch-2 {
  0% { transform: translate(0, 0); }
  50% { transform: translate(2px, -3px); }
  100% { transform: translate(0, 0); }
}
@keyframes rocket-launch-3 {
  0% { transform: translate(0, 0); }
  50% { transform: translate(2px, -3px); }
  100% { transform: translate(0, 0); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: rocket-launch-0 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0s both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: rocket-launch-1 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s both; }
.animated-lucide-icon:hover .animated-lucide-el-2,
.al-icon-wrapper:hover .animated-lucide-el-2 { animation: rocket-launch-2 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; }
.animated-lucide-icon:hover .animated-lucide-el-3,
.al-icon-wrapper:hover .animated-lucide-el-3 { animation: rocket-launch-3 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15000000000000002s both; }

</style>
