<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-arrow-right"
  role="img"
  aria-label="arrow right"
>
  <title>arrow right</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes arrow-shaft-slide {
  0% { transform: translateX(0); opacity: 1; }
  30% { transform: translateX(-8px); opacity: 0.3; }
  70% { transform: translateX(2px); opacity: 1; }
  100% { transform: translateX(0); }
}
@keyframes arrow-head-shoot {
  0% { transform: translateX(0); }
  40% { transform: translateX(6px); }
  70% { transform: translateX(-2px); }
  100% { transform: translateX(0); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: arrow-shaft-slide 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: arrow-head-shoot 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

</style>
  <path d="M5 12h14" class="animated-lucide-secondary animated-lucide-el-0" style="" />
  <path d="m12 5 7 7-7 7" class="animated-lucide-primary animated-lucide-el-1" style="" />
</svg>