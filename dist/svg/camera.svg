<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-camera"
  role="img"
  aria-label="camera"
>
  <title>camera</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes shutter-click-0 {
  0% { transform: scale(1); }
  20% { transform: scale(0.88); }
  40% { transform: scale(1.06); }
  60% { transform: scale(0.97); }
  100% { transform: scale(1); }
}
@keyframes shutter-click-1 {
  0% { transform: scale(1); opacity: 1; }
  20% { transform: scale(0.5); opacity: 0.3; }
  40% { transform: scale(1.3); opacity: 1; }
  60% { transform: scale(0.9); opacity: 0.8; }
  100% { transform: scale(1); opacity: 1; }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: shutter-click-0 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0s both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: shutter-click-1 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s both; }

</style>
  <path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" class="animated-lucide-primary animated-lucide-el-0" style="transform-origin: 12px 13px;" />
  <circle cx="12" cy="13" r="3" class="animated-lucide-secondary animated-lucide-el-1" style="transform-origin: 12px 13px;" />
</svg>