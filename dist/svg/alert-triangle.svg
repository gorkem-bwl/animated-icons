<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-alert-triangle"
  role="img"
  aria-label="alert triangle"
>
  <title>alert triangle</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes pulse-alert-triangle-0 {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.85; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes pulse-alert-triangle-1 {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.85; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes pulse-alert-triangle-2 {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.85; }
  100% { transform: scale(1); opacity: 1; }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: pulse-alert-triangle-0 0.5s ease 0s both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: pulse-alert-triangle-1 0.5s ease 0.1s both; }
.animated-lucide-icon:hover .animated-lucide-el-2,
.al-icon-wrapper:hover .animated-lucide-el-2 { animation: pulse-alert-triangle-2 0.5s ease 0.2s both; }

</style>
  <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" class="animated-lucide-primary animated-lucide-el-0" style="transform-origin: 12px 12px;" />
  <path d="M12 9v4" class="animated-lucide-secondary animated-lucide-el-1" style="transform-origin: 12px 12px;" />
  <path d="M12 17h.01" class="animated-lucide-secondary animated-lucide-el-2" style="transform-origin: 12px 12px;" />
</svg>