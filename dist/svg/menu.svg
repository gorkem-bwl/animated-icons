<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-menu"
  role="img"
  aria-label="menu"
>
  <title>menu</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes menu-line-0 {
  0% { transform: scaleX(1); }
  40% { transform: scaleX(1); }
  100% { transform: scaleX(1); }
}
@keyframes menu-line-1 {
  0% { transform: scaleX(1); }
  40% { transform: scaleX(0.9); }
  100% { transform: scaleX(1); }
}
@keyframes menu-line-2 {
  0% { transform: scaleX(1); }
  40% { transform: scaleX(0.8); }
  100% { transform: scaleX(1); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: menu-line-0 0.35s ease 0s both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: menu-line-1 0.35s ease 0.05s both; }
.animated-lucide-icon:hover .animated-lucide-el-2,
.al-icon-wrapper:hover .animated-lucide-el-2 { animation: menu-line-2 0.35s ease 0.1s both; }

</style>
  <path d="M4 5h16" class="animated-lucide-primary animated-lucide-el-0" style="transform-origin: left center;" />
  <path d="M4 12h16" class="animated-lucide-secondary animated-lucide-el-1" style="transform-origin: left center;" />
  <path d="M4 19h16" class="animated-lucide-primary animated-lucide-el-2" style="transform-origin: left center;" />
</svg>