<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="animated-lucide-icon animated-lucide-music"
  role="img"
  aria-label="music"
>
  <title>music</title>

<style>
  .animated-lucide-primary { stroke: var(--animated-lucide-primary, currentColor); }
  .animated-lucide-secondary { stroke: var(--animated-lucide-secondary, currentColor); opacity: 0.55; }
  .animated-lucide-icon:hover .animated-lucide-secondary,
  .al-icon-wrapper:hover .animated-lucide-secondary { opacity: 0.7; }
  .animated-lucide-icon * { transition: opacity 0.2s ease; }
@keyframes music-dance-0 {
  0% { transform: rotate(0deg) translateY(0); }
  20% { transform: rotate(12deg) translateY(-2px); }
  40% { transform: rotate(-8deg) translateY(1px); }
  60% { transform: rotate(5deg) translateY(-1px); }
  100% { transform: rotate(0deg) translateY(0); }
}
@keyframes music-dance-1 {
  0% { transform: rotate(0deg) translateY(0); }
  20% { transform: rotate(-8deg) translateY(-2px); }
  40% { transform: rotate(12deg) translateY(1px); }
  60% { transform: rotate(-5deg) translateY(-1px); }
  100% { transform: rotate(0deg) translateY(0); }
}
@keyframes music-dance-2 {
  0% { transform: rotate(0deg) translateY(0); }
  20% { transform: rotate(12deg) translateY(-2px); }
  40% { transform: rotate(-8deg) translateY(1px); }
  60% { transform: rotate(5deg) translateY(-1px); }
  100% { transform: rotate(0deg) translateY(0); }
}
.animated-lucide-icon:hover .animated-lucide-el-0,
.al-icon-wrapper:hover .animated-lucide-el-0 { animation: music-dance-0 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0s both; }
.animated-lucide-icon:hover .animated-lucide-el-1,
.al-icon-wrapper:hover .animated-lucide-el-1 { animation: music-dance-1 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.06s both; }
.animated-lucide-icon:hover .animated-lucide-el-2,
.al-icon-wrapper:hover .animated-lucide-el-2 { animation: music-dance-2 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.12s both; }

</style>
  <path d="M9 18V5l12-2v13" class="animated-lucide-primary animated-lucide-el-0" style="transform-origin: 12px 12px;" />
  <circle cx="6" cy="18" r="3" class="animated-lucide-secondary animated-lucide-el-1" style="transform-origin: 12px 12px;" />
  <circle cx="18" cy="16" r="3" class="animated-lucide-secondary animated-lucide-el-2" style="transform-origin: 12px 12px;" />
</svg>