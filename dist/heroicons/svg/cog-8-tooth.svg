  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" class="ah-secondary ah-anim-gear ah-delay-1" style="--ah-rotation: 90deg" />
</svg>